name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 本番値は Vercel 側で注入。CI はビルドが通ることだけ確認する
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          NEXT_TELEMETRY_DISABLED: '1'

      # tests/page-title.test.ts はビルド成果物(.next/server/app/*.html)を検査するため、
      # Build の後にもう一度走らせる（Test の時点では成果物が無くスキップされる）
      - name: Test (post-build)
        run: npm test
