name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 本番値は deploy ジョブで注入する。ここはビルドが通ることだけ確認する
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
          NEXT_TELEMETRY_DISABLED: '1'

      # tests/page-title.test.ts はビルド成果物(.next/server/app/*.html)を検査するため、
      # Build の後にもう一度走らせる（Test の時点では成果物が無くスキップされる）
      - name: Test (post-build)
        run: npm test

  # main への push で check が通ったら、Cloudflare Workers（個人の My Account）へ本番デプロイする。
  # 静的書き出しの成果物（out/）は約1GBで artifact で渡すには大きいので、ここでビルドし直す
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 施設データを変えると多くのページが変わり、アップロードに10分以上かかることがある
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip when the deploy token is not set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::secrets.CLOUDFLARE_API_TOKEN が未設定のためデプロイを省略した（手動なら env -u CLOUDFLARE_API_TOKEN npm run deploy）"

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
        env:
          # ページに埋め込まれる公開値（GA・AdSense の ID）。リポジトリの Variables で管理する
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        # アカウントは wrangler.jsonc の account_id（My Account）で固定している
        run: npx wrangler deploy
